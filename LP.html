<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rumor 4コマ LP</title>

<style>
  body {
    background:#05060a;
    color:#fff;
    font-family:"Noto Sans JP",sans-serif;
    padding:20px;
    display:flex;
    justify-content:center;
  }

  .wrap {
    width:100%;
    max-width:1080px;
  }

  /* 世界観ヘッダー（短い版） */
  .hero {
    margin-bottom:24px;
    padding:16px;
    background:#0a0e1a;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.08);
  }
  .hero-title {
    font-size:1.2rem;
    letter-spacing:0.1em;
    margin-bottom:8px;
  }
  .hero-sub {
    font-size:0.85rem;
    opacity:0.8;
    line-height:1.6;
  }

  /* 4コマ漫画構造 */
  .grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    direction:rtl; /* 右→左の流れ */
  }

  .panel {
    background:#0a0e1a;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:10px;
    padding:10px;
  }

   .panel img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 8px;
    background: #111;
  }

  .label {
    margin-top: 8px;
    font-size: 0.8rem;
    opacity: 0.8;
  }

  .cta {
    margin-top: 24px;
    padding: 16px;
    background: #0a0a1a;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 0.85rem;
    line-height: 1.6;
  }

  @media (max-width: 768px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .panel img { height: 170px; }
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
  }

  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
  }

  .panel {
    flex: 1 1 200px;
    text-align: center;
  }

  @media (max-width: 600px) {
    .grid {
      flex-direction: column;
      align-items: center;
    }
    .panel {
      width: 90%;
    }
  }

  .panel img {
    width: 100%;
    height: 180px; /* ここで高さを固定 */
    object-fit: cover; /* 画像を枠に合わせてトリミング */
    border-radius: 8px;
    background: #111;
  }

  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
  }

  .panel {
    flex: 1 1 200px;
    text-align: center;
  }

  @media (max-width: 600px) {
    .grid {
      flex-direction: column;
      align-items: center;
    }
    .panel {
      width: 90%;
    }
  }

 .panel img {
    width: 100%;
    height: 180px; /* ここで高さを固定 */
    object-fit: cover; /* 画像を枠に合わせてトリミング */
    border-radius: 8px;
    background: #111;
  }

  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
  }

  .panel {
    flex: 1 1 200px;
    text-align: center;
  }

  @media (max-width: 600px) {
    .grid {
      flex-direction: column;
      align-items: center;
    }
    .panel {
      width: 90%;
    }
  }

</style>
</head>

<body>
<div class="wrap">

  <!-- 世界観ヘッダー（短い版） -->
  <div class="hero">
    <div class="hero-title">rumor 世界観 × 4コマ構造</div>
    <div class="hero-sub">
      右上 → 左上 → 右下 → 左下 の流れで読む
      シンプルな画像4コマテンプレートです。
    </div>
  </div>

  <!-- 4コマ（画像版） -->
  <div class="grid">

    <div class="panel">
